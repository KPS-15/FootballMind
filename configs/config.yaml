system:
  name: "FootballMind"
  device: "auto" # auto, cuda, cpu
  log_level: "INFO"
  seed: 42

pitch:
  length: 105.0 # meters
  width: 68.0   # meters
  goal_width: 7.32 # meters
  goal_depth: 2.44 # meters

vision:
  yolo_model: "yolo11m.pt" # Default model: YOLO11m (configurable via FOOTBALLMIND_YOLO_MODEL env var or config.yaml)
  confidence_threshold: 0.35
  ball_confidence_threshold: 0.20 # Specialized lower threshold for small football ball detection
  iou_threshold: 0.45
  imgsz: 1280 # Default imgsz for fine-grained small object detection
  tracker_type: "bytetrack"
  fps_process: 15 # target processing FPS
  frame_skip: 2
  use_roboflow_workflow: false # Set true to enable cloud Roboflow workflow segmentation

roboflow:
  api_url: "https://serverless.roboflow.com"
  api_key: "6iE3b3FVMQzewTLHfWDT"
  workspace_name: "k-p-shohil"
  workflow_id: "general-segmentation-api"
  classes: "ball, player, referee, goalkeeper"
  use_cache: true

data:
  demo_mode: true
  dataset_dir: "datasets/"
  output_dir: "outputs/"

models:
  action_predictor_path: "models/action_predictor.pt"
  pass_predictor_path: "models/pass_predictor.pt"
  defensive_danger_path: "models/danger_model.pt"

backend:
  host: "127.0.0.1"
  port: 8000
  upload_dir: "uploads/"
